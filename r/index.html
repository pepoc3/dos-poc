<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>r</title><style>body{font:16px/1.6 system-ui,sans-serif;margin:14px}#c{width:130px;height:46px;font-size:26px;letter-spacing:6px;text-align:center}
button{font:16px/1.4 system-ui;padding:10px 14px;border-radius:8px;border:1px solid #888;background:#f0f0f0;margin-left:8px}</style>
<h3>输入 4 位码打开文章</h3><input id="c" maxlength="4" placeholder="abcd"><button id="go">打开文章</button><div id="o"></div><script>
var BASE='https://filed-ebony-accompanying-instruction.trycloudflare.com';
function openCode(code){var o=document.getElementById('o');o.textContent='查询中...';
 fetch(BASE+'/get/'+encodeURIComponent(code)).then(function(r){return r.json();}).then(function(j){
  if(j.url){var w=window.open(j.url,'_blank');if(!w){location.href=j.url;}}
  else{o.textContent='无效或过期的码';}
 }).catch(function(e){o.textContent='查询失败：'+e;});}
document.getElementById('go').addEventListener('click',function(){var c=document.getElementById('c').value.trim().toLowerCase();if(c)openCode(c);});
var q=new URLSearchParams(location.search).get('c');if(q){document.getElementById('c').value=q;openCode(q.toLowerCase());}
</script>
